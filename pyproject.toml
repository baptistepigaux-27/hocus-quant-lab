[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hocus-quant-lab"
version = "0.1.0"
description = "Point-in-time research sandbox for French equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2",
  "lightgbm>=4.5",
  "mlflow>=2.20",
  "numpy>=2.2",
  "optuna>=4.2",
  "pandas>=2.2",
  "pandera[pandas]>=0.22",
  "polars>=1.24",
  "pyarrow>=19.0",
  "pydantic>=2.10",
  "pytz>=2025.1",
  "scikit-learn>=1.6",
  "statsmodels>=0.14",
  "xgboost>=2.1",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "marimo>=0.25.0",
    "plotly>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hocus_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
